  nav-active pass correctly leaves them unmarked.

  is an ITA property. It is still named, as an outside resource, in the "What
  else is here?" answer on the homepage, and the route to submitting an event
  goes through that link. Do not restore this entry to make the nav look
  symmetrical — the asymmetry is the point.

  The build script injects class="nav-active" on the link matching the page
  being generated; do not add nav-active here.
-->
